<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plumbing Service Portal & Admin Dashboard</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Supabase Credentials
        const SUPABASE_URL = 'https://zfwvplsvnocjqdcbtgnc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dBBYbX3YDE-kH5ag-eGYGQ_ABIXwaOa';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // n8n Webhook Test URL
        const N8N_WEBHOOK_URL = 'https://appiautomation.app.n8n.cloud/webhook-test/b9630d7d-0d1e-4098-abd5-72ab78c0f4e4';

        // Admin Email
        const ADMIN_EMAIL = 'anaya.outreach467@gmail.com';

        function App() {
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            
            // Theme State ('light' or 'dark')
            const [darkMode, setDarkMode] = useState(false);

            // Admin Navigation Tab State ('manage-bookings', 'services-rates', 'profile')
            const [adminTab, setAdminTab] = useState('manage-bookings');

            // Data States
            const [bookings, setBookings] = useState([]);
            const [allBookings, setAllBookings] = useState([]);
            const [servicesList, setServicesList] = useState([
                { id: 1, name: 'Pipe Leak Repair', price: 2500 },
                { id: 2, name: 'Drain Unclogging', price: 3000 },
                { id: 3, name: 'Water Heater Install', price: 5500 },
                { id: 4, name: 'General Plumbing Check', price: 1500 }
            ]);

            // New Service Form States
            const [newServiceName, setNewServiceName] = useState('');
            const [newServicePrice, setNewServicePrice] = useState('');

            // Booking Form States (Client Side)
            const [serviceType, setServiceType] = useState('Pipe Leak Repair');
            const [preferredDate, setPreferredDate] = useState('');
            const [customerName, setCustomerName] = useState('');
            const [phone, setPhone] = useState('');
            const [address, setAddress] = useState('');
            const [notes, setNotes] = useState('');

            // Search & Filter States
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');

            // Profile Settings States
            const [newPassword, setNewPassword] = useState('');
            const [profileMsg, setProfileMsg] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) {
                        fetchData(session.user.id, session.user.email);
                    }
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) {
                        fetchData(session.user.id, session.user.email);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            const fetchData = async (userId, userEmail) => {
                const isAdmin = userEmail === ADMIN_EMAIL;

                if (isAdmin) {
                    const { data } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
                    setAllBookings(data || []);
                } else {
                    const { data } = await supabase.from('bookings').select('*').eq('user_id', userId).order('created_at', { ascending: false });
                    setBookings(data || []);
                }
            };

            const handleSignUp = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) setErrorMsg(error.message);
                else alert('Signup successful! Login now.');
                setLoading(false);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setErrorMsg(error.message);
                setLoading(false);
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setBookings([]);
                setAllBookings([]);
            };

            const handleUpdatePassword = async (e) => {
                e.preventDefault();
                if (!newPassword) return;
                setLoading(true);
                setProfileMsg('');
                const { error } = await supabase.auth.updateUser({ password: newPassword });
                if (error) setProfileMsg('Error: ' + error.message);
                else {
                    setProfileMsg('Password updated successfully!');
                    setNewPassword('');
                }
                setLoading(false);
            };

            // Admin Management Functions
            const handleAddService = (e) => {
                e.preventDefault();
                if (!newServiceName || !newServicePrice) return;

                const newServiceItem = {
                    id: Date.now(),
                    name: newServiceName,
                    price: Number(newServicePrice)
                };

                setServicesList([...servicesList, newServiceItem]);
                setNewServiceName('');
                setNewServicePrice('');
                alert('Service added successfully!');
            };

            const handleDeleteService = (id) => {
                setServicesList(servicesList.filter(s => s.id !== id));
            };

            const handleUpdateServicePrice = (id, newPrice) => {
                setServicesList(servicesList.map(s => s.id === id ? { ...s, price: Number(newPrice) } : s));
            };

            const handleCreateBooking = async (e) => {
                e.preventDefault();
                if (!session) return;

                const selectedServiceObj = servicesList.find(s => s.name === serviceType);
                const estimatedCost = selectedServiceObj ? `PKR ${selectedServiceObj.price.toLocaleString()}` : 'N/A';
                const fullNotes = `Name: ${customerName} | Phone: ${phone} | Address: ${address} | Cost: ${estimatedCost} | Note: ${notes}`;

                const { error } = await supabase.from('bookings').insert([
                    {
                        user_id: session.user.id,
                        service_type: serviceType,
                        preferred_date: preferredDate,
                        notes: fullNotes,
                        status: 'Pending'
                    }
                ]);

                if (error) {
                    alert('Error creating booking: ' + error.message);
                    return;
                }

                try {
                    await fetch(N8N_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_email: session.user.email,
                            service_type: serviceType,
                            preferred_date: preferredDate,
                            customer_name: customerName,
                            phone: phone,
                            address: address,
                            notes: notes,
                            estimated_cost: estimatedCost
                        })
                    });
                } catch (webhookErr) {
                    console.error('Webhook execution failed:', webhookErr);
                }

                setCustomerName('');
                setPhone('');
                setAddress('');
                setNotes('');
                setPreferredDate('');
                fetchData(session.user.id, session.user.email);
                alert('Booking created successfully!');
            };

            const handleCancelBooking = async (bookingId) => {
                if (!confirm('Kya aap is booking ko cancel karna chahte hain?')) return;
                const { error } = await supabase.from('bookings').delete().eq('id', bookingId);
                if (error) alert('Error: ' + error.message);
                else fetchData(session.user.id, session.user.email);
            };

            const handleUpdateStatus = async (bookingId, newStatus) => {
                const { error } = await supabase.from('bookings').update({ status: newStatus }).eq('id', bookingId);
                if (error) alert('Error: ' + error.message);
                else {
                    fetchData(session.user.id, session.user.email);
                    alert(`Status updated to ${newStatus}!`);
                }
            };

            const isAdmin = session?.user?.email === ADMIN_EMAIL;

            const filteredBookings = (isAdmin ? allBookings : bookings).filter((b) => {
                const matchesSearch = 
                    b.service_type.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    (b.notes && b.notes.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    b.preferred_date.includes(searchQuery);

                const matchesStatus = statusFilter === 'All' || b.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            // 1. LOGIN / SIGNUP SCREEN
            if (!session) {
                return (
                    <div className={`min-h-screen flex items-center justify-center p-4 transition-colors ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                        <div className={`max-w-md w-full rounded-xl shadow-lg p-8 border transition-colors ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold text-sky-500">Plumbing Portal</h2>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`px-3 py-1 rounded-lg text-xs font-medium border ${darkMode ? 'border-slate-600 bg-slate-700 text-yellow-400' : 'border-slate-200 bg-slate-100 text-slate-700'}`}
                                >
                                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>
                            <p className={`text-sm mb-6 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Login to access Client Portal or Admin Dashboard</p>
                            
                            {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4">{errorMsg}</div>}

                            <form className="space-y-4">
                                <div>
                                    <label className={`block text-sm font-medium mb-1 ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>Email Address</label>
                                    <input 
                                        type="email" 
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)}
                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none transition-colors ${darkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-slate-300 text-slate-800'}`}
                                        placeholder="name@example.com"
                                    />
                                </div>
                                <div>
                                    <label className={`block text-sm font-medium mb-1 ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>Password</label>
                                    <input 
                                        type="password" 
                                        value={password} 
                                        onChange={(e) => setPassword(e.target.value)}
                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none transition-colors ${darkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-slate-300 text-slate-800'}`}
                                        placeholder="••••••••"
                                    />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={handleLogin}
                                        disabled={loading}
                                        className="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 rounded-lg transition"
                                    >
                                        {loading ? 'Processing...' : 'Login'}
                                    </button>
                                    <button 
                                        onClick={handleSignUp}
                                        disabled={loading}
                                        className={`flex-1 font-medium py-2 rounded-lg transition ${darkMode ? 'bg-slate-700 hover:bg-slate-600 text-white' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}
                                    >
                                        Sign Up
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            // 2. DEDICATED ADMIN DASHBOARD VIEW
            if (isAdmin) {
                return (
                    <div className={`min-h-screen p-6 max-w-5xl mx-auto transition-colors ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                        {/* Admin Header */}
                        <header className={`flex justify-between items-center p-5 rounded-2xl shadow-sm mb-6 border transition-colors ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100'}`}>
                            <div>
                                <span className="bg-sky-100 text-sky-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Super Admin</span>
                                <h1 className={`text-xl font-extrabold mt-1 ${darkMode ? 'text-white' : 'text-slate-900'}`}>Dedicated Admin Dashboard</h1>
                                <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Logged in: {session.user.email}</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`px-3 py-2 rounded-xl text-xs font-medium border ${darkMode ? 'border-slate-600 bg-slate-700 text-yellow-400' : 'border-slate-200 bg-slate-100 text-slate-700'}`}
                                >
                                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                                </button>
                                <button 
                                    onClick={handleLogout}
                                    className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-semibold transition"
                                >
                                    Logout
                                </button>
                            </div>
                        </header>

                        {/* Admin Nav Tabs */}
                        <div className="flex gap-2 mb-6">
                            <button 
                                onClick={() => setAdminTab('manage-bookings')}
                                className={`px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-sm ${adminTab === 'manage-bookings' ? 'bg-sky-600 text-white' : (darkMode ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-white text-slate-700 border border-slate-200')}`}
                            >
                                📋 Manage Bookings
                            </button>
                            <button 
                                onClick={() => setAdminTab('services-rates')}
                                className={`px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-sm ${adminTab === 'services-rates' ? 'bg-sky-600 text-white' : (darkMode ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-white text-slate-700 border border-slate-200')}`}
                            >
                                ⚙️ Services & Rates
                            </button>
                            <button 
                                onClick={() => setAdminTab('profile')}
                                className={`px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-sm ${adminTab === 'profile' ? 'bg-sky-600 text-white' : (darkMode ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-white text-slate-700 border border-slate-200')}`}
                            >
                                🔒 Profile Settings
                            </button>
                        </div>

                        {/* Tab 1: Manage Bookings */}
                        {adminTab === 'manage-bookings' && (
                            <div className={`p-6 rounded-2xl shadow-sm border transition-colors ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100'}`}>
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                                    <h3 className={`font-bold text-lg ${darkMode ? 'text-white' : 'text-slate-800'}`}>All Client Bookings</h3>
                                    <div className="flex gap-2 w-full sm:w-auto">
                                        <input 
                                            type="text" placeholder="Search bookings..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                            className={`px-3 py-2 border rounded-xl text-xs outline-none flex-1 sm:w-48 ${darkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-400' : 'bg-white border-slate-300 text-slate-800'}`}
                                        />
                                        <select 
                                            value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
                                            className={`px-3 py-2 border rounded-xl text-xs outline-none ${darkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-slate-300 text-slate-800'}`}
                                        >
                                            <option value="All">All Status</option>
                                            <option value="Pending">Pending</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                                    {filteredBookings.length === 0 ? (
                                        <p className={`text-sm py-8 text-center ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>No bookings found.</p>
                                    ) : (
                                        filteredBookings.map(b => (
                                            <div key={b.id} className={`p-4 border rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-colors ${darkMode ? 'bg-slate-700/50 border-slate-600' : 'bg-slate-50 border-slate-200'}`}>
                                                <div className="space-y-1">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`font-bold text-sm ${darkMode ? 'text-white' : 'text-slate-900'}`}>{b.service_type}</span>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                                            b.status === 'Completed' ? 'bg-green-100 text-green-700' : 
                                                            b.status === 'In Progress' ? 'bg-yellow-100 text-yellow-700' : 
                                                            'bg-sky-100 text-sky-700'
                                                        }`}>
                                                            {b.status || 'Pending'}
                                                        </span>
                                                    </div>
                                                    <p className={`text-xs ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>📅 Date: {b.preferred_date}</p>
                                                    <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>📝 {b.notes}</p>
                                                </div>

                                                <div className="flex items-center gap-2 self-end sm:self-center">
                                                    <select 
                                                        value={b.status || 'Pending'} 
                                                        onChange={(e) => handleUpdateStatus(b.id, e.target.value)}
                                                        className={`text-xs px-3 py-2 border rounded-xl outline-none font-bold ${darkMode ? 'bg-slate-600 border-slate-500 text-white' : 'bg-white border-slate-300 text-slate-800'}`}
                                                    >
                                                        <option value="Pending">Pending</option>
                                                        <option value="In Progress">In Progress</option>
                                                        <option value="Completed">Completed</option>
                                                    </select>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Tab 2: Services & Rates */}
